# Default settings for the sharron skill. To change one, put just that key in config.toml next to this file (gitignored); every other key keeps the default below.
platform = "auto"                 # auto | claude-code | codex | copilot | cursor | work | hybrid
auto_install = true               # install missing service-list skills automatically
max_parallel_subagents = 3
max_skills_per_brief = 4          # at most this many service-list skills per brief

[platforms.claude-code.models]
T1 = "haiku"
T2 = "sonnet"
T3 = "opus"

[platforms.copilot.models]        # model ids from the Copilot CLI model list (checked 2026-10-28); your plan must include them
T1 = "claude-haiku-5.5"
T2 = "claude-sonnet-5.5"
T3 = "claude-opus-5.5"

[platforms.work.models]           # one model: put the same name in every tier
T1 = ""
T2 = ""
T3 = ""

[platforms.hybrid]
available = []                    # the models you can choose from; fill in later

[platforms.hybrid.models]
T1 = ""
T2 = ""
T3 = ""

[roles]                           # tier per role
sharron = "T3"
planner = "T2"
researcher = "T2"
verifier = "T1"
reviewer = "T2"
security = "T2"
analyst = "T2"
writer = "T2"
engineer = "T2"
diagnostician = "T3"
operator = "T1"
tutor = "T2"
finance = "T1"

[prices]                          # equivalent USD per million tokens, per model id
# Checked 2026-10-28 against https://platform.claude.com/docs/en/about-claude/pricing
# cache_write is the 5-minute cache write price. Haiku 5.5 is the price for prompts up to 100,000 tokens
# (over 100,000: input 0.50, output 2.50, cache_write 0.625, cache_read 0.05). Edit these when prices change.
"claude-opus-5-5" = { input = 4.0, output = 20.0, cache_write = 5.0, cache_read = 0.2 }
"claude-sonnet-5-5" = { input = 2.0, output = 10.0, cache_write = 2.5, cache_read = 0.1 }
"claude-haiku-5-5" = { input = 0.1, output = 0.5, cache_write = 0.125, cache_read = 0.01 }
"claude-fable-5-1" = { input = 10.0, output = 50.0, cache_write = 12.5, cache_read = 0.25 }

[risk]
currency = "TWD"
small_amount = 500
large_amount = 3000

[budget]                          # equivalent USD per task by difficulty, until the ledger has data
default_per_task = { "1" = 0.2, "2" = 0.5, "3" = 1.5, "4" = 4.0, "5" = 10.0 }
overrun_factor = 1.5

[standing_orders]
always = []
never = []

# [installed.<skill>] tables are written by sharron after automatic installs.
