# ---- Tools (the security role runs them after automatic installs; report only)
# Versions are the latest releases on 2026-10-28. The install forms come from each tool's README; they were not run here.

# Cisco skill-scanner: PyPI package cisco-ai-skill-scanner 2.3.2. Static mode is the default (core analyzers only, no LLM).
[[tools]]
name = "skill-scanner"
check = 'skill-scanner --version'
install = 'uv tool install cisco-ai-skill-scanner==2.3.2'
run = 'skill-scanner scan <skill folder>'
sends_data = false

# NVIDIA SkillSpector: not on PyPI, so the install pins the commit of tag v2.13.1. --no-llm keeps the scan static, but its
# SC4 check still sends dependency names and versions to api.osv.dev (README, "Trust model and data egress"), so sends_data is true.
[[tools]]
name = "skillspector"
check = 'skillspector --version'
install = 'uv tool install "git+https://github.com/NVIDIA/SkillSpector.git@f3b25697d76256998ca9d42c198d256258d4c035"'
run = 'skillspector scan <skill folder> --no-llm --format json'
sends_data = true

# Snyk agent-scan: PyPI package snyk-agent-scan 0.6.9. It needs SNYK_TOKEN and sends data about the scanned components to
# Snyk's analysis service, so sends_data is true. The tool has no --version flag, so the check reads uv's tool list.
[[tools]]
name = "agent-scan"
check = "uv tool list | grep '^snyk-agent-scan '"
install = 'uv tool install snyk-agent-scan==0.6.9'
run = 'snyk-agent-scan scan <skill folder>'
sends_data = true
